<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Alumnos - Sistema Académico</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    .search-highlight {
        background-color: yellow;
        font-weight: bold;
    }
</style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-graduation-cap me-2"></i>Sistema Académico
            </a>
            <div class="navbar-nav ms-auto">
                <div id="userMenu">
                    <span class="navbar-text me-3" id="userInfo"></span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">
                        <i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>
                    <i class="fas fa-users me-2"></i> Gestión de Alumnos
                </h2>
                <p class="text-muted mb-0" id="alumnosUserName">
                    <i class="fas fa-user me-1"></i> 
                    <span id="alumnosUserNameText">Cargando...</span>
                </p>
            </div>
            <div>
                <button class="btn btn-secondary me-2" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-tachometer-alt me-1"></i> Dashboard
                </button>
                <button class="btn btn-success" id="adminActions" onclick="alumnos.mostrarFormulario()">
                    <i class="fas fa-plus me-1"></i> Nuevo Alumno
                </button>
            </div>
        </div>

        <!-- Búsqueda única -->
        <div class="row mb-3">
            <div class="col-md-8">
                <div class="input-group">
                    <input type="text" class="form-control" id="buscarAlumno" 
                           placeholder="Buscar por ID, nombre, email o carrera..." 
                           onkeyup="alumnos.buscar(this.value)">
                    <button class="btn btn-secondary" type="button" onclick="alumnos.limpiarBusqueda()">
                        <i class="fas fa-eraser me-1"></i> Limpiar
                    </button>
                </div>
            </div>
        </div>

        <!-- Tabla de alumnos -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>Email</th>
                                <th>Edad</th>
                                <th>Carrera</th>
                                <th id="accionesHeader">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="alumnosTable">
                            <!-- Se carga dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para editar/crear alumno -->
    <div class="modal fade" id="alumnoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitleText">Nuevo Alumno</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="alumnoForm">
                        <input type="hidden" id="alumnoId">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="alumnoNombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="alumnoEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Edad</label>
                            <input type="number" class="form-control" id="alumnoEdad" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Carrera</label>
                            <input type="text" class="form-control" id="alumnoCarrera" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardar" onclick="alumnos.guardar()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor para alertas -->
    <div id="alertContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="alumnos.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!auth.hasValidToken()) {
            window.location.href = 'login.html';
            return;
        }
        
        // Mostrar información del usuario
        const userInfo = auth.getUserInfo();
        const username = userInfo.username;
        const roleRaw = localStorage.getItem('user_role');
        const role = auth.getRolAmigable ? auth.getRolAmigable() : 'Usuario';
        
        const alumnosUserNameText = document.getElementById('alumnosUserNameText');
        if (alumnosUserNameText) {
            alumnosUserNameText.innerHTML = `<strong>${username}</strong> <span class="badge bg-${getRoleBadgeColor(roleRaw)}">${role}</span>`;
        }
        
        // Cargar alumnos
        if (typeof alumnos !== 'undefined') {
            alumnos.cargarAlumnos();
        }
    });
    
    function getRoleBadgeColor(role) {
        const colors = {
            'ROLE_ADMIN': 'danger',
            'ROLE_PROFESOR': 'warning',
            'ROLE_ALUMNO': 'success'
        };
        return colors[role] || 'secondary';
    }
    </script>
</body>
</html>
