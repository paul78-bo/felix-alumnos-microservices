<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Tareas - Sistema Académico</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand" href="dashboard.html">
				<i class="fas fa-graduation-cap me-2"></i>Sistema Académico
			</a>
			<div class="navbar-nav ms-auto">
				<div id="authButtons" style="display: none;">
					<button class="btn btn-outline-light"
						onclick="window.location.href='login.html'">
						<i class="fas fa-sign-in-alt me-1"></i>Iniciar Sesión
					</button>
				</div>
				<div id="userMenu">
					<span class="navbar-text me-3" id="userInfo"></span>
					<button class="btn btn-outline-light btn-sm" onclick="logout()">
						<i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión
					</button>
				</div>
			</div>
		</div>
	</nav>

	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h2>
					<i class="fas fa-tasks me-2"></i> Mis Tareas
				</h2>
				<p class="text-muted mb-0" id="tareasUserName">
					<i class="fas fa-user me-1"></i> <span id="tareasUserNameText">Cargando...</span>
				</p>
			</div>
			<div>
				<button class="btn btn-info me-2" id="btnVolverAlumnos"
					onclick="window.location.href='alumnos.html'">
					<i class="fas fa-arrow-left me-1"></i> Volver a Alumnos
				</button>
				<button class="btn btn-success" id="btnSubirTarea"
					onclick="window.location.href='form-tarea.html'">
					<i class="fas fa-upload me-1"></i> <span id="btnSubirTareaTexto">Subir Tarea</span>
				</button>
				<button class="btn btn-secondary me-2"
					onclick="window.location.href='dashboard.html'">
					<i class="fas fa-tachometer-alt me-1"></i> Dashboard
				</button>
			</div>
		</div>

		<!-- Filtros de búsqueda -->
		<div class="row mb-3">
			<div class="col-md-3">
				<input type="text" class="form-control" id="searchTitulo"
					placeholder="Buscar por título..." onkeyup="tareas.filtrar()">
			</div>
			<div class="col-md-3" id="filtroAlumnoContainer">
				<input type="text" class="form-control" id="searchAlumno"
					placeholder="Buscar por alumno..." onkeyup="tareas.filtrar()">
			</div>
			<div class="col-md-3">
				<select class="form-select" id="filterEstado" onchange="tareas.filtrar()">
					<option value="">Todos los estados</option>
					<option value="pendiente">Pendientes</option>
					<option value="calificada">Calificadas</option>
				</select>
			</div>
			<div class="col-md-3">
				<select class="form-select" id="ordenFecha" onchange="tareas.filtrar()">
					<option value="reciente">📅 Más reciente primero</option>
					<option value="antiguo">📅 Más antiguo primero</option>
				</select>
			</div>
		</div>

		<!-- Tabla de tareas -->
		<div class="card">
			<div class="card-body">
				<div class="table-responsive">
					<table class="table table-striped table-hover">
						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>Tarea</th>
								<th id="headerAlumno">Alumno</th>
								<th>Tarea Entregada</th>
								<th>Fecha</th>
								<th>Calificación</th>
								<th>Estado</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody id="tareasTable">
							<tr>
								<td colspan="8" class="text-center py-4">
									<div class="spinner-border text-primary" role="status">
										<span class="visually-hidden">Cargando...</span>
									</div>
									<p class="mt-2">Cargando tareas...</p>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				
				<!-- Paginación -->
				<div id="paginacion" class="mt-3"></div>
			</div>
		</div>
	</div>

	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="auth.js"></script>
	<script src="tareas.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', async function() {
			// Verificación síncrona rápida
			if (!auth.hasValidToken()) {
				window.location.href = 'login.html';
				return;
			}
			
			// Verificación asíncrona con backend
			const sesionValida = await auth.verificarSesionInicial();
			if (!sesionValida) {
				window.location.href = 'login.html';
				return;
			}

			const userInfo = auth.getUserInfo();
			const username = userInfo.username;
			const roleRaw = sessionStorage.getItem('user_role');
			const role = auth.getRolAmigable ? auth.getRolAmigable() : 'Usuario';

			const tareasUserNameText = document.getElementById('tareasUserNameText');
			if (tareasUserNameText) {
				tareasUserNameText.innerHTML = `<strong>${username}</strong> <span class="badge bg-${getRoleBadgeColor(roleRaw)}">${role}</span>`;
			}

			mostrarMenuUsuario();

			const userRole = sessionStorage.getItem('user_role');
			const esAlumno = userRole === 'ROLE_ALUMNO';

			// Ocultar botón "Volver a Alumnos" para alumnos
			const btnVolverAlumnos = document.getElementById('btnVolverAlumnos');
			if (btnVolverAlumnos && esAlumno) {
				btnVolverAlumnos.style.display = 'none';
			}

			// Cambiar texto del botón según rol
			const btnSubirTareaTexto = document.getElementById('btnSubirTareaTexto');
			if (btnSubirTareaTexto) {
				if (esAlumno) {
					btnSubirTareaTexto.textContent = '📤 Entregar Tarea';
				} else {
					btnSubirTareaTexto.textContent = '➕ Crear Tarea';
				}
			}

			// Ocultar filtro de alumno para alumnos
			const filtroAlumnoContainer = document.getElementById('filtroAlumnoContainer');
			if (filtroAlumnoContainer && esAlumno) {
				filtroAlumnoContainer.style.display = 'none';
			}

			// Ocultar columna "Alumno" en el header para alumnos
			const headerAlumno = document.getElementById('headerAlumno');
			if (headerAlumno && esAlumno) {
				headerAlumno.style.display = 'none';
			}
			
			const btnSubirTarea = document.getElementById('btnSubirTarea');
			if (btnSubirTarea && esAlumno) {
				btnSubirTarea.style.display = 'none';
			}

			// Cargar tareas con paginación
			tareas.cargarTareas();
			
		
		});

		function getRoleBadgeColor(role) {
			const colors = {
				'ROLE_ADMIN': 'danger',
				'ROLE_PROFESOR': 'warning',
				'ROLE_ALUMNO': 'success'
			};
			return colors[role] || 'secondary';
		}
	</script>
</body>
</html>
