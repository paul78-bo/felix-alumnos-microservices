<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Usuario - Sistema Académico</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
.badge {
	padding: 5px 10px;
	border-radius: 20px;
	font-size: 0.75rem;
	font-weight: 500;
}
</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand" href="index.html"> <i
				class="fas fa-graduation-cap me-2"></i>Sistema Académico
			</a>
			<div class="navbar-nav ms-auto">
				<div id="userMenu">
					<span class="navbar-text me-3" id="userInfo"></span>
					<button class="btn btn-outline-light btn-sm" onclick="logout()">
						<i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión
					</button>
				</div>
			</div>
		</div>
	</nav>

	<div class="container mt-4">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card">
					<div class="card-header bg-primary text-white">
						<div class="d-flex justify-content-between align-items-center">
							<h4 class="mb-0">
								<i class="fas fa-user-plus me-2"></i> <span id="formTitle">Nuevo Usuario</span>
							</h4>
							<button class="btn btn-outline-light btn-sm"
								onclick="window.location.href='usuarios.html'">
								<i class="fas fa-arrow-left me-1"></i> Volver
							</button>
						</div>
						<!-- ✅ NOMBRE DEL USUARIO VISIBLE -->
						<p class="text-white-50 mb-0 mt-2" id="usuarioFormUserName">
							<i class="fas fa-user me-1"></i> 
							<span id="usuarioFormUserNameText">Cargando...</span>
						</p>
					</div>
					<div class="card-body">
						<form id="usuarioForm">
							<input type="hidden" id="usuarioId">

							<div class="mb-3">
								<label class="form-label">Username:</label> <input type="text"
									class="form-control" id="username" required>
							</div>

							<div class="mb-3">
								<label class="form-label">Email:</label> <input type="email"
									class="form-control" id="email" required>
							</div>

							<div class="mb-3">
								<label class="form-label">Contraseña <span
									id="passwordOptional"></span>:
								</label> <input type="password" class="form-control" id="password">
								<div class="form-text" id="passwordHelp">Mínimo 6
									caracteres</div>
							</div>

							<div class="mb-3">
								<label class="form-label">Rol:</label> <select
									class="form-select" id="role" required>
									<option value="">Seleccionar...</option>
									<option value="ROLE_ADMIN">Administrador</option>
									<option value="ROLE_PROFESOR">Profesor</option>
									<option value="ROLE_ALUMNO">Alumno</option>
								</select>
							</div>

							<div class="mb-3">
								<div class="form-check">
									<input type="checkbox" class="form-check-input" id="enabled"
										checked> <label class="form-check-label">Usuario
										activo</label>
								</div>
							</div>

							<!-- Campos adicionales para ALUMNO -->
							<div id="alumnoFields" style="display: none;">
								<hr>
								<h5>Datos del Alumno</h5>
								<div class="mb-3">
									<label class="form-label">Nombre completo:</label> <input
										type="text" class="form-control" id="nombreAlumno">
								</div>
								<div class="row">
									<div class="col-md-6">
										<div class="mb-3">
											<label class="form-label">Edad:</label> <input type="number"
												class="form-control" id="edadAlumno">
										</div>
									</div>
									<div class="col-md-6">
										<div class="mb-3">
											<label class="form-label">Carrera:</label> <input type="text"
												class="form-control" id="carreraAlumno">
										</div>
									</div>
								</div>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							onclick="window.location.href='usuarios.html'">Cancelar</button>
						<button type="button" class="btn btn-primary"
							onclick="usuarios.guardar()">
							<i class="fas fa-save me-1"></i> Guardar
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="auth.js"></script>
	<script src="usuarios.js"></script>
	<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!auth.hasValidToken()) {
            window.location.href = 'index.html';
            return;
        }
        
        // ✅ Mostrar NOMBRE DE USUARIO (Felix) + rol
        const userInfo = auth.getUserInfo();
        const username = userInfo.username;  // ← "Felix"
        const roleRaw = localStorage.getItem('user_role');
        const role = auth.getRolAmigable ? auth.getRolAmigable() : 'Usuario';
        
        const usuarioFormUserNameText = document.getElementById('usuarioFormUserNameText');
        if (usuarioFormUserNameText) {
            usuarioFormUserNameText.innerHTML = `<strong>${username}</strong> <span class="badge bg-${getRoleBadgeColor(roleRaw)}">${role}</span>`;
        }
        
        mostrarMenuUsuario();
        usuarios.initForm();
    });
    
    function getRoleBadgeColor(role) {
        const colors = {
            'ROLE_ADMIN': 'danger',
            'ROLE_PROFESOR': 'warning',
            'ROLE_ALUMNO': 'success'
        };
        return colors[role] || 'secondary';
    }
</script>
</body>
</html>
