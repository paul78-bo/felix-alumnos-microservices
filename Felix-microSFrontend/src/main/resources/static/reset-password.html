<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-success {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            border: none;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo i {
            font-size: 3rem;
            color: #4CAF50;
        }
        .password-strength {
            height: 5px;
            margin-top: 5px;
            border-radius: 3px;
            transition: all 0.3s;
        }
        .strength-weak { background-color: #dc3545; width: 25%; }
        .strength-fair { background-color: #ffc107; width: 50%; }
        .strength-good { background-color: #28a745; width: 75%; }
        .strength-strong { background-color: #20c997; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body p-5">
                        <div class="logo">
                            <i class="fas fa-key"></i>
                            <h2 class="mt-3">Nueva Contraseña</h2>
                            <p class="text-muted">Crea una nueva contraseña para tu cuenta</p>
                        </div>
                        
                        <div id="tokenStatus" class="alert alert-info d-none">
                            <i class="fas fa-spinner fa-spin me-2"></i>
                            <span id="tokenStatusText">Validando token...</span>
                        </div>
                        
                        <form id="resetPasswordForm" class="d-none">
                            <input type="hidden" id="resetShortId">
                            
                            <div class="mb-4">
                                <label for="newPassword" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Nueva contraseña
                                </label>
                                <input type="password" 
                                       class="form-control form-control-lg" 
                                       id="newPassword" 
                                       required
                                       minlength="6"
                                       placeholder="Mínimo 6 caracteres">
                                <div class="password-strength" id="passwordStrength"></div>
                                <div class="form-text">
                                    La contraseña debe tener al menos 6 caracteres
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Confirmar contraseña
                                </label>
                                <input type="password" 
                                       class="form-control form-control-lg" 
                                       id="confirmPassword" 
                                       required
                                       placeholder="Repite la contraseña">
                                <div class="form-text" id="passwordMatch"></div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg" id="btnSubmit" disabled>
                                    <i class="fas fa-save me-2"></i> Cambiar contraseña
                                </button>
                                <a href="login.html" class="btn btn-outline-secondary btn-lg">
                                    <i class="fas fa-arrow-left me-2"></i> Volver al login
                                </a>
                            </div>
                        </form>
                        
                        <div id="messageContainer" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="password-reset.js"></script>
    
    <script>
        function getShortIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('shortId');
        }
        
        // ✅ CORREGIDO: Un solo DOMContentLoaded, sin verificación de auth (es página pública)
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Página de nueva contraseña cargada');
            
            const shortId = getShortIdFromURL();
            if (!shortId) {
                if (typeof passwordReset !== 'undefined') {
                    passwordReset.showMessage('error', 'Token no encontrado. El enlace es incorrecto.');
                }
                return;
            }
            
            console.log('🔍 shortId obtenido:', shortId);
            if (typeof passwordReset !== 'undefined') {
                passwordReset.validateShortId(shortId);
            }
        });
    </script>
</body>
</html>
