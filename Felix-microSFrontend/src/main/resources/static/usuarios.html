<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Usuarios - Sistema Académico</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
.badge {
	padding: 5px 10px;
	border-radius: 20px;
	font-size: 0.75rem;
	font-weight: 500;
}

.badge.bg-danger {
	background: #dc3545;
}

.badge.bg-warning {
	background: #ffc107;
	color: #212529;
}

.badge.bg-success {
	background: #28a745;
}
</style>
</head>
<body>
	<!-- Navbar -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand" href="dashboard.html"> <i
				class="fas fa-graduation-cap me-2"></i>Sistema Académico
			</a>
			<div class="navbar-nav ms-auto">
				<div id="userMenu">
					<span class="navbar-text me-3" id="userInfo"></span>
					<button class="btn btn-outline-light btn-sm" onclick="logout()">
						<i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión
					</button>
				</div>
			</div>
		</div>
	</nav>

	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h2>
					<i class="fas fa-users-cog me-2"></i> Gestión de Usuarios
				</h2>
				<p class="text-muted mb-0" id="usuariosUserName">
					<i class="fas fa-user me-1"></i> <span id="usuariosUserNameText">Cargando...</span>
				</p>
			</div>
			<div>
				<button class="btn btn-info me-2"
					onclick="window.location.href='alumnos.html'">
					<i class="fas fa-arrow-left me-1"></i> Volver a Alumnos
				</button>
				<button class="btn btn-success me-2"
					onclick="window.location.href='form-usuario.html'">
					<i class="fas fa-plus me-1"></i> Nuevo Usuario
				</button>
				<button class="btn btn-secondary"
					onclick="window.location.href='dashboard.html'">
					<i class="fas fa-tachometer-alt me-1"></i> Dashboard
				</button>
			</div>
		</div>

		<!-- Filtros de búsqueda con botones de limpiar -->
		<div class="row mb-3">
			<div class="col-md-6">
				<div class="input-group">
					<input type="text" class="form-control" id="searchUsername"
						placeholder="Buscar por username..." onkeyup="usuarios.filtrar()">
					<button class="btn btn-outline-secondary" type="button"
						onclick="usuarios.limpiarFiltroUsername()"
						title="Limpiar búsqueda">
						<i class="fas fa-times"></i>
					</button>
				</div>
			</div>
			<div class="col-md-6">
				<div class="input-group">
					<input type="text" class="form-control" id="searchEmail"
						placeholder="Buscar por email..." onkeyup="usuarios.filtrar()">
					<button class="btn btn-outline-secondary" type="button"
						onclick="usuarios.limpiarFiltroEmail()" title="Limpiar búsqueda">
						<i class="fas fa-times"></i>
					</button>
				</div>
			</div>
		</div>

		<!-- Tabla de usuarios -->
		<div class="card">
			<div class="card-body">
				<div class="table-responsive">
					<table class="table table-striped table-hover">
						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>Username</th>
								<th>Email</th>
								<th>Rol</th>
								<th>Estado</th>
								<th>Alumno</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody id="usuariosTable">
							<!-- Se carga dinámicamente -->
						</tbody>
					</table>

					<!-- Paginación -->
					<div id="paginacion" class="mt-3"></div>
				</div>
			</div>
		</div>
	</div>

	<!-- Modal para cambiar rol -->
	<div class="modal fade" id="cambiarRolModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Cambiar Rol de Usuario</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<input type="hidden" id="cambiarRolUserId">
					<div class="mb-3">
						<label class="form-label">Usuario: <span
							id="cambiarRolUsername"></span></label>
					</div>
					<div class="mb-3">
						<label class="form-label">Nuevo Rol:</label> <select
							class="form-select" id="nuevoRol">
							<option value="ROLE_ADMIN">Administrador</option>
							<option value="ROLE_PROFESOR">Profesor</option>
							<option value="ROLE_ALUMNO">Alumno</option>
						</select>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Cancelar</button>
					<button type="button" class="btn btn-primary"
						onclick="usuarios.guardarCambioRol()">Guardar</button>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="auth.js"></script>
	<script src="usuarios.js"></script>
	<script>
		
			document.addEventListener('DOMContentLoaded', async function() {
			    // Verificación síncrona rápida
			    if (!auth.hasValidToken()) {
			        window.location.href = 'login.html';
			        return;
			    }
			    
			    // Verificación asíncrona con backend
			    const sesionValida = await auth.verificarSesionInicial();
			    if (!sesionValida) {
			        window.location.href = 'login.html';
			        return;
			    }

			const userInfo = auth.getUserInfo();
			const username = userInfo.username;
			const roleRaw = sessionStorage.getItem('user_role');
			const role = auth.getRolAmigable ? auth.getRolAmigable() : 'Usuario';

			const usuariosUserNameText = document.getElementById('usuariosUserNameText');
			if (usuariosUserNameText) {
				usuariosUserNameText.innerHTML = `<strong>${username}</strong> <span class="badge bg-${getRoleBadgeColor(roleRaw)}">${role}</span>`;
			}

			mostrarMenuUsuario();
			usuarios.cargarUsuarios();
		});

		function getRoleBadgeColor(role) {
			const colors = {
				'ROLE_ADMIN': 'danger',
				'ROLE_PROFESOR': 'warning',
				'ROLE_ALUMNO': 'success'
			};
			return colors[role] || 'secondary';
		}
		
		function logout() {
			localStorage.clear();
			sessionStorage.clear();
			window.location.href = 'login.html';
		}
		
		function mostrarMenuUsuario() {
			const userRole = sessionStorage.getItem('user_role');
			const userNombre = sessionStorage.getItem('user_nombre') || 'Usuario';
			const roleText = userRole === 'ROLE_ADMIN' ? 'Administrador' : 
							userRole === 'ROLE_PROFESOR' ? 'Profesor' : 
							userRole === 'ROLE_ALUMNO' ? 'Alumno' : 'Usuario';
			
			const userInfo = document.getElementById('userInfo');
			if (userInfo) {
				userInfo.innerHTML = `<i class="fas fa-user-circle me-1"></i> ${userNombre} (${roleText})`;
			}
		}
	</script>
</body>
</html>
