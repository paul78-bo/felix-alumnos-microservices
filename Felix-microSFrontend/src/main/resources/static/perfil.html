<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil - Sistema Académico</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    .profile-card {
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .profile-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 2rem;
        border-radius: 15px 15px 0 0;
        text-align: center;
    }
    .profile-icon {
        font-size: 5rem;
        margin-bottom: 1rem;
    }
    .info-section {
        padding: 2rem;
    }
    #editMode {
        display: none;
        margin-top: 20px;
        background-color: #f9f9f9;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #ddd;
    }
</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-graduation-cap me-2"></i>Sistema Académico
            </a>
            <div class="navbar-nav ms-auto">
                <div id="userMenu">
                    <span class="navbar-text me-3" id="userInfo"></span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">
                        <i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card profile-card">
                    <div class="card-header bg-primary text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <h4 class="mb-0">
                                <i class="fas fa-user-circle me-2"></i> Mi Perfil
                            </h4>
                            <div>
                                <button class="btn btn-outline-light btn-sm me-2" onclick="window.location.href='dashboard.html'">
                                    <i class="fas fa-tachometer-alt me-1"></i> Dashboard
                                </button>
                                <button class="btn btn-outline-light btn-sm" onclick="window.location.href='tareas.html'">
                                    <i class="fas fa-tasks me-1"></i> Mis Tareas
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="profile-header">
                        <i class="fas fa-user-circle profile-icon"></i>
                        <h2 id="perfilNombre">Cargando...</h2>
                        <p class="mb-0" id="perfilRolBadge"></p>
                    </div>
                    <div class="info-section">
                        <!-- Modo visualización -->
                        <div id="viewMode">
                            <div class="row mb-3">
                                <div class="col-md-4 fw-bold">ID:</div>
                                <div class="col-md-8" id="viewId">-</div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4 fw-bold">Usuario:</div>
                                <div class="col-md-8" id="viewUsername">-</div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4 fw-bold">Email:</div>
                                <div class="col-md-8" id="viewEmail">-</div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4 fw-bold">Rol:</div>
                                <div class="col-md-8" id="viewRole">-</div>
                            </div>
                            <div class="row mb-3" id="alumnoInfo">
                                <div class="col-md-4 fw-bold">Nombre Completo:</div>
                                <div class="col-md-8" id="viewAlumnoNombre">-</div>
                            </div>
                            <div class="row mb-3" id="alumnoCarreraInfo">
                                <div class="col-md-4 fw-bold">Carrera:</div>
                                <div class="col-md-8" id="viewAlumnoCarrera">-</div>
                            </div>
                            <div class="row mb-3" id="alumnoEdadInfo">
                                <div class="col-md-4 fw-bold">Edad:</div>
                                <div class="col-md-8" id="viewAlumnoEdad">-</div>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-end">
                                <button class="btn btn-primary" id="btnEditarPerfil">
                                    <i class="fas fa-edit me-1"></i> Editar Perfil
                                </button>
                            </div>
                        </div>

                        <!-- Modo edición -->
                        <div id="editMode">
                            <form id="perfilForm">
                                <div class="mb-3">
                                    <label class="form-label">ID:</label>
                                    <input type="text" class="form-control" id="editId" readonly disabled>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Usuario:</label>
                                    <input type="text" class="form-control" id="editUsername" readonly disabled>
                                    <div class="form-text">El nombre de usuario no se puede cambiar</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email:</label>
                                    <input type="email" class="form-control" id="editEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Nueva Contraseña (opcional):</label>
                                    <input type="password" class="form-control" id="editPassword" placeholder="Dejar en blanco para no cambiar">
                                </div>
                                <div class="mb-3" id="editAlumnoFields">
                                    <label class="form-label">Nombre Completo:</label>
                                    <input type="text" class="form-control" id="editAlumnoNombre">
                                </div>
                                <div class="mb-3" id="editCarreraFields">
                                    <label class="form-label">Carrera:</label>
                                    <input type="text" class="form-control" id="editAlumnoCarrera">
                                </div>
                                <div class="mb-3" id="editEdadFields">
                                    <label class="form-label">Edad:</label>
                                    <input type="number" class="form-control" id="editAlumnoEdad">
                                </div>
                                <hr>
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" class="btn btn-secondary" onclick="perfil.toggleEditMode()">Cancelar</button>
                                    <button type="button" class="btn btn-success" onclick="perfil.guardarPerfil()">
                                        <i class="fas fa-save me-1"></i> Guardar Cambios
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="perfil.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!auth.hasValidToken()) {
                window.location.href = 'login.html';
                return;
            }
            mostrarMenuUsuario();
            perfil.cargarPerfil();
            
            document.getElementById('btnEditarPerfil').addEventListener('click', function() {
                perfil.toggleEditMode();
            });
        });
        
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
