<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo i {
            font-size: 3rem;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body p-5">
                        <div class="logo">
                            <i class="fas fa-lock"></i>
                            <h2 class="mt-3">Recuperar Contraseña</h2>
                            <p class="text-muted">Ingresa tu email para recibir un enlace de recuperación</p>
                        </div>
                        
                        <form id="forgotPasswordForm">
                            <div class="mb-4">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope me-2"></i>Email registrado
                                </label>
                                <input type="email" 
                                       class="form-control form-control-lg" 
                                       id="email" 
                                       required
                                       placeholder="ejemplo@universidad.edu">
                                <div class="form-text">
                                    Te enviaremos un enlace para restablecer tu contraseña
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg" id="btnSubmit">
                                    <i class="fas fa-paper-plane me-2"></i> Enviar enlace de recuperación
                                </button>
                                <a href="login.html" class="btn btn-outline-secondary btn-lg">
                                    <i class="fas fa-arrow-left me-2"></i> Volver al login
                                </a>
                            </div>
                        </form>
                        
                        <div id="messageContainer" class="mt-4"></div>
                    </div>
                </div>
                
                <div class="text-center text-white mt-4">
                    <p>¿Recordaste tu contraseña? <a href="login.html" class="text-white fw-bold">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="password-reset.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Página de recuperación de contraseña cargada');
            
            const form = document.getElementById('forgotPasswordForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    if (email && typeof passwordReset !== 'undefined') {
                        passwordReset.forgotPassword(email);
                    }
                });
            }
        });
    </script>
</body>
</html>
