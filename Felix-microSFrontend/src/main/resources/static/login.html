<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión - Sistema Académico</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
    }
    .login-card {
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        overflow: hidden;
    }
    .login-header {
        background: #2c3e50;
        color: white;
        padding: 1.5rem;
        text-align: center;
    }
    .login-body {
        padding: 2rem;
    }
    .btn-login {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 0.75rem;
        font-weight: bold;
    }
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .countdown-timer {
        font-size: 1.5rem;
        font-weight: bold;
        font-family: monospace;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card">
                    <div class="login-header">
                        <i class="fas fa-graduation-cap fa-3x mb-2"></i>
                        <h3 class="mb-0">Sistema Académico</h3>
                        <h3 class="mb-0">nivel secundaria</h3>
                        <p class="mb-0 mt-2">Iniciar Sesión</p>
                    </div>
                    <div class="login-body">
                        <div id="alertContainer"></div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="mb-3 text-end">
                                <a href="forgot-password.html" class="text-decoration-none">
                                    <i class="fas fa-key me-1"></i>¿Olvidaste tu contraseña?
                                </a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-login" id="loginBtn">
                                <i class="fas fa-sign-in-alt me-2"></i>Ingresar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
    let countdownInterval = null;
    
    function iniciarContador(bloqueadoHasta) {
        // Detener cualquier contador previo
        if (countdownInterval) {
            clearInterval(countdownInterval);
        }
        
        const loginBtn = document.getElementById('loginBtn');
        const formInputs = document.querySelectorAll('#username, #password');
        
        // Deshabilitar botón y campos
        loginBtn.disabled = true;
        formInputs.forEach(input => input.disabled = true);
        
        function actualizarContador() {
            const now = Math.floor(Date.now() / 1000);
            const segundosRestantes = bloqueadoHasta - now;
            
            if (segundosRestantes <= 0) {
                // Fin del bloqueo
                clearInterval(countdownInterval);
                loginBtn.disabled = false;
                formInputs.forEach(input => input.disabled = false);
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Ingresar';
                
                const alertContainer = document.getElementById('alertContainer');
                alertContainer.innerHTML = `
                    <div class="alert alert-success alert-dismissible fade show">
                        <i class="fas fa-check-circle me-2"></i>
                        Bloqueo expirado. Ya puedes intentar nuevamente.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                return;
            }
            
            const minutos = Math.floor(segundosRestantes / 60);
            const segundos = segundosRestantes % 60;
            
            loginBtn.innerHTML = `<i class="fas fa-clock me-2"></i>Espere ${minutos}:${segundos.toString().padStart(2, '0')} min`;
        }
        
        actualizarContador();
        countdownInterval = setInterval(actualizarContador, 1000);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        // Si ya hay sesión válida, redirigir al dashboard
        if (auth.hasValidToken()) {
            console.log('⚠️ Ya hay sesión activa, redirigiendo...');
            window.location.href = 'dashboard.html';
            return;
        }
        
        const form = document.getElementById('loginForm');
        const alertContainer = document.getElementById('alertContainer');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button[type="submit"]');
            
            alertContainer.innerHTML = '';
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Validando...';
            
            try {
                const result = await auth.login(username, password);
                
                if (result.success) {
                    console.log('✅ Login exitoso para:', username);
                    window.location.href = 'dashboard.html';
                } else if (result.status === 429 && result.blockedUntil) {
                    // Iniciar contador regresivo
                    iniciarContador(result.blockedUntil);
                } else if (result.remainingAttempts !== undefined) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger alert-dismissible fade show">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            ${result.message}
                            <div class="mt-1 small">Intentos restantes: ${result.remainingAttempts}</div>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    `;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Ingresar';
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger alert-dismissible fade show">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            ${result.message}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    `;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Ingresar';
                }
            } catch (error) {
                console.error('Error:', error);
                alertContainer.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Error de conexión
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Ingresar';
            }
        });
    });
    </script>
</body>
</html>
