<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subir Tarea - Sistema Académico</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand" href="dashboard.html"> <i
				class="fas fa-graduation-cap me-2"></i>Sistema Académico
			</a>
			<div class="navbar-nav ms-auto">
				<div id="userMenu">
					<span class="navbar-text me-3" id="userInfo"></span>
					<button class="btn btn-outline-light btn-sm" onclick="logout()">
						<i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión
					</button>
				</div>
			</div>
		</div>
	</nav>

	<div class="container mt-4">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card">
					<div class="card-header bg-primary text-white">
						<div class="d-flex justify-content-between align-items-center">
							<h4 class="mb-0">
								<i class="fas fa-upload me-2"></i> Subir Nueva Tarea
							</h4>
							<button class="btn btn-outline-light btn-sm"
								onclick="window.location.href='tareas.html'">
								<i class="fas fa-arrow-left me-1"></i> Volver
							</button>
						</div>
						<p class="text-white-50 mb-0 mt-2" id="tareaFormUserName">
							<i class="fas fa-user me-1"></i> <span id="tareaFormUserNameText">Cargando...</span>
						</p>
					</div>
					<div class="card-body">
						<form id="tareaForm" enctype="multipart/form-data">
							<div class="mb-3">
								<label class="form-label">Título:</label> <input type="text"
									class="form-control" id="titulo" required>
							</div>

							<div class="mb-3">
								<label class="form-label">Descripción:</label>
								<textarea class="form-control" id="descripcion" rows="3"></textarea>
							</div>

							<div class="mb-3" id="alumnoField" style="display: none;">
								<label class="form-label">Alumno:</label> <select
									class="form-select" id="alumnoId" required>
									<option value="">Seleccionar alumno...</option>
								</select>
							</div>

							<div class="mb-3">
								<label class="form-label">Archivo (PDF):</label> <input
									type="file" class="form-control" id="archivo" accept=".pdf"
									required>
								<div class="form-text">Máximo 20MB, solo PDF</div>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							onclick="window.location.href='tareas.html'">Cancelar</button>
						<button type="button" class="btn btn-primary"
							onclick="tareas.guardar()">
							<i class="fas fa-upload me-1"></i> Subir Tarea
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="auth.js"></script>
	<script src="tareas.js"></script>
	<script>
		document
				.addEventListener(
						'DOMContentLoaded',
						function() {
							if (!auth.hasValidToken()) {
								window.location.href = 'login.html';
								return;
							}

							const userInfo = auth.getUserInfo();
							const username = userInfo.username;
							const roleRaw = sessionStorage.getItem('user_role');
							const role = auth.getRolAmigable ? auth
									.getRolAmigable() : 'Usuario';

							const tareaFormUserNameText = document
									.getElementById('tareaFormUserNameText');
							if (tareaFormUserNameText) {
								tareaFormUserNameText.innerHTML = `<strong>${username}</strong> <span class="badge bg-${getRoleBadgeColor(roleRaw)}">${role}</span>`;
							}

							mostrarMenuUsuario();
							tareas.initForm(); // ✅ Esto carga los alumnos correctamente
						});

		function getRoleBadgeColor(role) {
			const colors = {
				'ROLE_ADMIN' : 'danger',
				'ROLE_PROFESOR' : 'warning',
				'ROLE_ALUMNO' : 'success'
			};
			return colors[role] || 'secondary';
		}
	</script>
</body>
</html>
